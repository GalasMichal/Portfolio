name: DA-Bubble FTP discover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Find live bundle on FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          timeout 180 lftp -c "
            set ftp:ssl-force true
            set ssl:verify-certificate no
            set net:timeout 20
            set net:max-retries 2
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ftps://${FTP_SERVER}
            pwd
            cls -1
            echo '--- find main-KXWXFB2K.js ---'
            find . -name 'main-KXWXFB2K.js'
            echo '--- find main-UFGJXADU.js ---'
            find . -name 'main-UFGJXADU.js'
            echo '--- index in da-bubble.michal-galas.de ---'
            cat da-bubble.michal-galas.de/index.html 2>/dev/null | head -c 4000 | grep -o 'main-[A-Z0-9]*\.js' | head -1 || echo 'no index or no match'
            quit
          " 2>&1 | tee discover.log
          echo "Done."
