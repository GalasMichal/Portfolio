name: Deploy to All-Inkl

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-allinkl-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_HREF: ${{ vars.BASE_HREF || '/' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://michal-galas.de' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate FTP secrets
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_REMOTE_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build -- --configuration=production --base-href="$BASE_HREF"

      - name: Normalize FTP remote dir
        run: |
          DIR="${{ secrets.FTP_REMOTE_DIR }}"
          case "$DIR" in
            */) ;;
            *) DIR="${DIR}/" ;;
          esac
          echo "FTP_REMOTE_DIR_NORM=$DIR" >> "$GITHUB_ENV"

      - name: Deploy via FTPS (All-Inkl)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/portfolio/browser/
          server-dir: ${{ env.FTP_REMOTE_DIR_NORM }}
          timeout: 600000
          log-level: verbose
          state-name: .ftp-deploy-sync-state-portfolio.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deploy sendMail.php to server root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./public/
          server-dir: ${{ env.FTP_REMOTE_DIR_NORM }}
          timeout: 600000
          log-level: minimal
          dangerous-clean-slate: false

      - name: Verify production deploy
        run: |
          echo "Expecting prerendered content on $SITE_URL/projekte"
          for i in $(seq 1 12); do
            HTML=$(curl -fsSL "$SITE_URL/projekte" || true)
            if echo "$HTML" | grep -q 'Projekte & Erfahrungen'; then
              echo "Deploy verified: /projekte prerendered"
              curl -fsSL "$SITE_URL/" | grep -q 'Was heute kompliziert' && echo "Homepage hero verified" || echo "::warning::Hero headline not yet live"
              curl -fsSL "$SITE_URL/llms.txt" | grep -q 'Michal Galas' && echo "llms.txt verified" || echo "::warning::llms.txt not reachable"
              exit 0
            fi
            echo "Attempt $i/12: prerendered content not yet live, waiting 15s..."
            sleep 15
          done
          echo "::warning::Prerendered /projekte may not be live yet – check FTP_REMOTE_DIR"
          exit 1
