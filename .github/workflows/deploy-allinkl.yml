name: Deploy to All-Inkl

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-allinkl-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_HREF: ${{ vars.BASE_HREF || '/' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://michal-galas.de' }}

    steps:
      # No marketplace actions: repo policy allows only GalasMichal-owned actions.
      - name: Checkout
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_REMOTE_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Node.js
        run: |
          set -euo pipefail
          curl -fsSL "https://nodejs.org/dist/v22.17.0/node-v22.17.0-linux-x64.tar.xz" -o /tmp/node.tar.xz
          sudo tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build -- --configuration=production --base-href="$BASE_HREF"

      - name: Normalize FTP remote dir
        env:
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          DIR="$FTP_REMOTE_DIR"
          case "$DIR" in
            */) ;;
            *) DIR="${DIR}/" ;;
          esac
          echo "FTP_REMOTE_DIR_NORM=$DIR" >> "$GITHUB_ENV"

      - name: Deploy via FTPS (All-Inkl)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          test -d ./dist/portfolio/browser
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftps://${FTP_SERVER}:21" -e "
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate false
            set net:max-retries 3
            set net:timeout 60
            set cmd:fail-exit true
            mirror -R --verbose --parallel=4 ./dist/portfolio/browser/ ${FTP_REMOTE_DIR_NORM}
            bye
          "

      - name: Deploy public root files via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -d ./public
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftps://${FTP_SERVER}:21" -e "
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate false
            set net:max-retries 3
            set net:timeout 60
            set cmd:fail-exit true
            mirror -R --verbose --parallel=2 ./public/ ${FTP_REMOTE_DIR_NORM}
            bye
          "

      - name: Verify production deploy
        run: |
          set -euo pipefail
          echo "Expecting prerendered content on $SITE_URL/"
          for i in $(seq 1 12); do
            HTML=$(curl -fsSL "$SITE_URL/" || true)
            if echo "$HTML" | grep -q 'Was heute kompliziert'; then
              echo "Deploy verified: homepage hero live"
              curl -fsSL "$SITE_URL/llms.txt" | grep -q 'Michal Galas' && echo "llms.txt verified" || echo "::warning::llms.txt not reachable"
              curl -fsSL "$SITE_URL/projekte" | grep -q 'Ausgewählte Projekte' && echo "/projekte verified" || echo "::warning::/projekte may not be prerendered yet"
              exit 0
            fi
            echo "Attempt $i/12: homepage content not yet live, waiting 15s..."
            sleep 15
          done
          echo "::warning::Homepage may not be live yet - check FTP_REMOTE_DIR and secrets"
          exit 1