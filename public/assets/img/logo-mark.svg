<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="MG">
  <defs>
    <clipPath id="mark-clip">
      <rect width="48" height="48" rx="12" />
    </clipPath>
  </defs>
  <g clip-path="url(#mark-clip)">
    <!-- Latitude / grid motif -->
    <g opacity="0.18" stroke="var(--color-primary, #c0c1ff)" stroke-width="0.5">
      <line x1="0" y1="12" x2="48" y2="12" />
      <line x1="0" y1="24" x2="48" y2="24" />
      <line x1="0" y1="36" x2="48" y2="36" />
      <line x1="12" y1="0" x2="12" y2="48" />
      <line x1="24" y1="0" x2="24" y2="48" />
      <line x1="36" y1="0" x2="36" y2="48" />
    </g>
    <!-- Code bracket accents -->
    <path
      d="M6 16 L3 24 L6 32"
      stroke="var(--color-primary, #c0c1ff)"
      stroke-width="1.25"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.45"
    />
    <path
      d="M42 16 L45 24 L42 32"
      stroke="var(--color-primary, #c0c1ff)"
      stroke-width="1.25"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.45"
    />
    <!-- MG monogram -->
    <path
      d="M11 34 V14 L17.5 25 L24 14 V34"
      stroke="var(--color-on-surface, #e5e2e1)"
      stroke-width="2.75"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M28.5 22.5 C28.5 17.5 32.5 14 37 14 C41.5 14 44.5 17.5 44.5 22 C44.5 28 40 32 34.5 32 H28.5"
      stroke="var(--color-primary, #c0c1ff)"
      stroke-width="2.75"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <line
      x1="34.5"
      y1="22"
      x2="44.5"
      y2="22"
      stroke="var(--color-primary, #c0c1ff)"
      stroke-width="2.75"
      stroke-linecap="round"
    />
    <!-- Accent pin dot -->
    <circle cx="38" cy="8" r="2" fill="var(--color-primary, #c0c1ff)" />
  </g>
  <rect
    x="0.75"
    y="0.75"
    width="46.5"
    height="46.5"
