<header
  class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30"
>
  <div class="max-w-[1280px] mx-auto px-4 md:px-12 h-16 flex items-center justify-between">
    <a
      routerLink="/"
      class="flex items-center shrink-0 hover:opacity-90 transition-opacity"
      (click)="closeMenu()"
      [attr.aria-label]="profile.name"
    >
      <app-logo class="hidden sm:block h-8 w-auto" />
      <app-logo variant="mark" class="sm:hidden h-8 w-8" [ariaLabel]="profile.name" />
    </a>

    <nav class="hidden lg:flex items-center gap-6">
      @for (item of profile.navigation; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="text-primary border-b-2 border-primary"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="font-label text-sm text-on-surface-variant hover:text-on-surface transition-colors pb-1"
        >
          {{ 'nav.' + item.key | translate }}
        </a>
      }
    </nav>

    <div class="hidden lg:flex items-center gap-2">
      <button
        type="button"
        class="p-1 rounded-lg hover:opacity-80 transition-opacity font-label text-xs font-semibold text-on-surface-variant min-w-6 h-4 flex items-center justify-center border border-outline-variant/50 rounded-sm"
        [class.border-primary]="languageService.currentLang() === 'de'"
        [class.text-primary]="languageService.currentLang() === 'de'"
        (click)="changeLanguage('de')"
        aria-label="Deutsch"
      >
        DE
      </button>
      <button
        type="button"
        class="p-1 rounded-lg hover:opacity-80 transition-opacity font-label text-xs font-semibold text-on-surface-variant min-w-6 h-4 flex items-center justify-center border border-outline-variant/50 rounded-sm"
        [class.border-primary]="languageService.currentLang() === 'en'"
        [class.text-primary]="languageService.currentLang() === 'en'"
        (click)="changeLanguage('en')"
        aria-label="English"
      >
        EN
      </button>
      <button
        type="button"
        class="p-1 rounded-lg hover:opacity-80 transition-opacity font-label text-xs font-semibold text-on-surface-variant min-w-6 h-4 flex items-center justify-center border border-outline-variant/50 rounded-sm"
        [class.border-primary]="languageService.currentLang() === 'pl'"
        [class.text-primary]="languageService.currentLang() === 'pl'"
        (click)="changeLanguage('pl')"
        aria-label="Polski"
      >
        PL
      </button>
      <button
        type="button"
        class="p-2 rounded-lg micro-border text-on-surface-variant hover:text-primary transition-colors"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.theme() === 'dark' ? ('common.themeLight' | translate) : ('common.themeDark' | translate)"
      >
        <span class="material-symbols-outlined text-xl">
          {{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}
        </span>
      </button>
      <a
        routerLink="/kontakt"
        class="bg-primary text-on-primary px-5 py-2 rounded-lg font-label text-sm hover:opacity-90 transition-all"
      >
        {{ 'common.projectRequest' | translate }}
      </a>
    </div>

    <div class="lg:hidden flex items-center gap-1.5">
      <button
        type="button"
        class="p-1 font-label text-xs font-semibold text-on-surface-variant min-w-6 h-4 flex items-center justify-center border border-outline-variant/50 rounded-sm"
        [class.border-primary]="languageService.currentLang() === 'de'"
        [class.text-primary]="languageService.currentLang() === 'de'"
        (click)="changeLanguage('de')"
        aria-label="Deutsch"
      >
        DE
      </button>
      <button
        type="button"
        class="p-1 font-label text-xs font-semibold text-on-surface-variant min-w-6 h-4 flex items-center justify-center border border-outline-variant/50 rounded-sm"
        [class.border-primary]="languageService.currentLang() === 'en'"
        [class.text-primary]="languageService.currentLang() === 'en'"
        (click)="changeLanguage('en')"
        aria-label="English"
      >
        EN
      </button>
      <button
        type="button"
        class="p-1 font-label text-xs font-semibold text-on-surface-variant min-w-6 h-4 flex items-center justify-center border border-outline-variant/50 rounded-sm"
        [class.border-primary]="languageService.currentLang() === 'pl'"
        [class.text-primary]="languageService.currentLang() === 'pl'"
        (click)="changeLanguage('pl')"
        aria-label="Polski"
      >
        PL
      </button>
      <button
        type="button"
        class="p-2 text-on-surface"
        (click)="toggleMenu()"
        [attr.aria-label]="'common.menuOpen' | translate"
      >
        <span class="material-symbols-outlined">{{ menuOpen() ? 'close' : 'menu' }}</span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav class="lg:hidden border-t border-outline-variant/30 bg-surface-container-low px-4 py-4 space-y-2">
      @for (item of profile.navigation; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="text-primary"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="block py-2 font-label text-on-surface-variant"
          (click)="closeMenu()"
        >
          {{ 'nav.' + item.key | translate }}
        </a>
      }
      <button
        type="button"
        class="flex items-center gap-2 py-2 font-label text-on-surface-variant"
        (click)="themeService.toggle()"
      >
        <span class="material-symbols-outlined text-lg">
          {{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}
        </span>
        {{ 'common.themeToggle' | translate }}
      </button>
      <a
        routerLink="/kontakt"
        class="block mt-2 text-center bg-primary text-on-primary px-5 py-2 rounded-lg font-label text-sm"
        (click)="closeMenu()"
      >
        {{ 'common.projectRequest' | translate }}
      </a>
    </nav>
  }
</header>
