<section class="pt-24 pb-20 px-4 md:px-12">
  <div class="max-w-[1280px] mx-auto space-y-12">
    <div>
      <h1 class="font-headline text-3xl md:text-4xl font-bold text-on-surface">{{ 'services.headline' | translate }}</h1>
      <p class="text-on-surface-variant mt-4 max-w-3xl leading-relaxed">{{ 'services.text' | translate }}</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      @for (service of services; track service.id) {
        <app-service-card [serviceId]="service.id" [icon]="service.icon" [wide]="service.span === 'wide'" />
      }
    </div>
  </div>
</section>
