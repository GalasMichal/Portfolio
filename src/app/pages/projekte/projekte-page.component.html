<section class="pt-24 pb-20 px-4 md:px-12">
  <div class="max-w-[1280px] mx-auto">
    <div class="mb-8">
      <h1 class="font-headline text-3xl md:text-4xl font-bold text-on-surface">{{ 'projects.headline' | translate }}</h1>
      <p class="text-on-surface-variant mt-2 max-w-3xl">{{ 'projects.text' | translate }}</p>
      <p class="text-sm text-on-surface-variant border border-outline-variant/30 rounded-lg px-4 py-3 bg-surface-container-low mt-4 max-w-3xl">
        {{ 'projects.confidentialityNotice' | translate }}
      </p>
    </div>
    <div class="flex flex-wrap gap-2 mb-10">
      @for (filter of filters; track filter) {
        <button
          type="button"
          class="px-4 py-2 rounded-full text-sm font-label transition-all"
          [class.bg-primary]="activeFilter() === filter"
          [class.text-on-primary]="activeFilter() === filter"
          [class.micro-border]="activeFilter() !== filter"
          [class.text-on-surface-variant]="activeFilter() !== filter"
          (click)="setFilter(filter)"
        >
          {{ 'projects.filters.' + filter | translate }}
        </button>
      }
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (project of projects(); track project.id) {
        <app-project-card
          [project]="project"
          [expanded]="expandedProjectId === project.id"
          (toggle)="toggleProject(project.id)"
        />
      }
    </div>
  </div>
</section>
