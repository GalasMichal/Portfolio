<div class="preview preview--kendo" aria-hidden="true">
  <div class="kendo-toolbar">
    <span class="kendo-toolbar__title">Grid</span>
    <span class="kendo-toolbar__btn"></span>
    <span class="kendo-toolbar__btn kendo-toolbar__btn--active"></span>
  </div>
  <div class="kendo-grid">
    <div class="kendo-grid__header">
      <span class="kendo-grid__cell kendo-grid__cell--check"></span>
      <span class="kendo-grid__cell">ID</span>
      <span class="kendo-grid__cell">Name</span>
      <span class="kendo-grid__cell">Status</span>
    </div>
    @for (row of [1, 2, 3, 4]; track row) {
      <div class="kendo-grid__row" [style.animation-delay]="(row - 1) * 0.4 + 's'">
        <span class="kendo-grid__cell kendo-grid__cell--check">
          <span class="kendo-check" [class.kendo-check--on]="row <= 2"></span>
        </span>
        <span class="kendo-grid__cell kendo-grid__cell--id">{{ 1000 + row }}</span>
        <span class="kendo-grid__cell kendo-grid__cell--name">Eintrag {{ row }}</span>
        <span class="kendo-grid__cell">
          <span class="kendo-status" [class.kendo-status--active]="row % 2 === 0">Aktiv</span>
        </span>
      </div>
    }
  </div>
</div>
